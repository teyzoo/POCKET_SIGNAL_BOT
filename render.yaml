services:
  - type: web
    name: POCKET_SIGNAL_BOT
    runtime: python
    plan: free
    branch: main

    buildCommand: |
      set -e

      echo "=============================================="
      echo "INSTALLING PYTHON DEPENDENCIES"
      echo "=============================================="

      pip install --upgrade pip
      pip install -r requirements.txt

      echo "=============================================="
      echo "PREPARING PLAYWRIGHT DIRECTORY"
      echo "=============================================="

      export PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.cache/ms-playwright

      mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"

      echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"

      echo "=============================================="
      echo "INSTALLING PLAYWRIGHT CHROMIUM"
      echo "=============================================="

      python -m playwright install chromium

      echo "=============================================="
      echo "INSTALLING PLAYWRIGHT SYSTEM DEPENDENCIES"
      echo "=============================================="

      python -m playwright install-deps chromium

      echo "=============================================="
      echo "VERIFYING PLAYWRIGHT"
      echo "=============================================="

      python -c "import playwright; print('Playwright import: OK')"

      python -m playwright --version

      echo "=============================================="
      echo "PLAYWRIGHT BROWSER FILES"
      echo "=============================================="

      find "$PLAYWRIGHT_BROWSERS_PATH" \
        -maxdepth 5 \
        -type f \
        \( -name chrome -o -name chromium -o -name firefox \) \
        -print || true

      echo "=============================================="
      echo "VERIFYING CHROMIUM EXECUTABLE"
      echo "=============================================="

      PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
      python -c "
      import os
      from playwright.sync_api import sync_playwright

      print('Browser path:', os.environ.get('PLAYWRIGHT_BROWSERS_PATH'))

      with sync_playwright() as p:
          path = p.chromium.executable_path

          print('Chromium executable:', path)
          print('Chromium exists:', os.path.isfile(path))

          if not os.path.isfile(path):
              raise SystemExit(
                  'ERROR: Playwright Chromium was NOT installed'
              )

          print('Chromium executable exists: OK')
      "

      echo "=============================================="
      echo "TESTING CHROMIUM STARTUP"
      echo "=============================================="

      PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
      python -c "
      from playwright.sync_api import sync_playwright

      with sync_playwright() as p:
          print('Launching Chromium...')

          browser = p.chromium.launch(
              headless=True,
              args=[
                  '--no-sandbox',
                  '--disable-dev-shm-usage',
                  '--disable-gpu'
              ]
          )

          print('Chromium launch: OK')

          browser.close()

          print('Chromium close: OK')
      "

      echo "=============================================="
      echo "PLAYWRIGHT INSTALLATION COMPLETE"
      echo "=============================================="

    startCommand: python main.py

    healthCheckPath: /health

    envVars:

      # ======================================================
      # PYTHON
      # ======================================================

      - key: PYTHON_VERSION
        value: "3.13.11"

      # ======================================================
      # PLAYWRIGHT
      # ======================================================

      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "/opt/render/project/src/.cache/ms-playwright"

      # ======================================================
      # TELEGRAM
      # ======================================================

      - key: BOT_TOKEN
        sync: false

      - key: OWNER_ID
        sync: false

      # ======================================================
      # DATABASE
      # ======================================================

      - key: DATABASE_URL
        sync: false

      # ======================================================
      # POCKET OPTION
      # ======================================================

      - key: PO_EMAIL
        sync: false

      - key: PO_PASSWORD
        sync: false

      - key: PO_SSID
        sync: false

      - key: PO_AUTO_LOGIN
        value: "true"

      - key: PO_DEMO
        value: "true"

      # ======================================================
      # BOT SETTINGS
      # ======================================================

      - key: JOIN_REQUIRED
        value: "false"

      - key: MIN_SIGNAL_SCORE
        value: "75"

      - key: MIN_PROBABILITY
        value: "75"

      - key: SCAN_INTERVAL
        value: "60"

      - key: TIMEZONE
        value: "Europe/Moscow"
