services:

* type: web
    name: POCKET_SIGNAL_BOT
    runtime: python
    plan: free
    branch: main
    buildCommand: |
    set -e
    echo “==============================================”
    echo “INSTALLING PYTHON DEPENDENCIES”
    echo “==============================================”
    pip install –upgrade pip
    pip install -r requirements.txt
    echo “==============================================”
    echo “PLAYWRIGHT SETUP”
    echo “==============================================”
    export PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.cache/ms-playwright
    mkdir -p “$PLAYWRIGHT_BROWSERS_PATH”
    echo “PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH”
    python -m playwright –version
    echo “==============================================”
    echo “INSTALLING CHROMIUM”
    echo “==============================================”
    PLAYWRIGHT_BROWSERS_PATH=”$PLAYWRIGHT_BROWSERS_PATH” 
    python -m playwright install chromium
    echo “==============================================”
    echo “INSTALLING CHROMIUM SYSTEM DEPENDENCIES”
    echo “==============================================”
    python -m playwright install-deps chromium
    echo “==============================================”
    echo “VERIFYING CHROMIUM”
    echo “==============================================”
    PLAYWRIGHT_BROWSERS_PATH=”$PLAYWRIGHT_BROWSERS_PATH” 
    python -c “
    import os
    from playwright.sync_api import sync_playwright
    print(‘Browser directory:’, os.environ.get(‘PLAYWRIGHT_BROWSERS_PATH’))
    with sync_playwright() as p:
    executable = p.chromium.executable_path

  print('Chromium executable:', executable)
  print('Chromium exists:', os.path.isfile(executable))
  if not os.path.isfile(executable):
      raise RuntimeError(
          'Chromium was NOT installed correctly'
      )
  print('Chromium installation: OK')

    “
    echo “==============================================”
    echo “TESTING CHROMIUM STARTUP”
    echo “==============================================”
    PLAYWRIGHT_BROWSERS_PATH=”$PLAYWRIGHT_BROWSERS_PATH” 
    python -c “
    from playwright.sync_api import sync_playwright
    with sync_playwright() as p:
    print(‘Starting Chromium…’)

  browser = p.chromium.launch(
      headless=True,
      args=[
          '--no-sandbox',
          '--disable-dev-shm-usage',
          '--disable-gpu'
      ]
  )
  print('Chromium startup: OK')
  browser.close()
  print('Chromium shutdown: OK')

    “
    echo “==============================================”
    echo “PLAYWRIGHT READY”
    echo “==============================================”
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
    * key: PYTHON_VERSION
        value: “3.13.11”
    * key: PLAYWRIGHT_BROWSERS_PATH
        value: “/opt/render/project/src/.cache/ms-playwright”
    * key: BOT_TOKEN
        sync: false
    * key: OWNER_ID
        sync: false
    * key: DATABASE_URL
        sync: false
    * key: PO_EMAIL
        sync: false
    * key: PO_PASSWORD
        sync: false
    * key: PO_SSID
        sync: false
    * key: PO_AUTO_LOGIN
        value: “true”
    * key: PO_DEMO
        value: “true”
    * key: JOIN_REQUIRED
        value: “false”
    * key: MIN_SIGNAL_SCORE
        value: “75”
    * key: MIN_PROBABILITY
        value: “75”
    * key: SCAN_INTERVAL
        value: “60”
    * key: TIMEZONE
        value: “Europe/Moscow”
