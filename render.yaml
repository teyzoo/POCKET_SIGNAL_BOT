services:
  - type: web
    name: pocket-signal-bot
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: python main.py

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: OWNER_ID
        sync: false

      - key: JOIN_CHAT_ID
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: pocket-signal-db
          property: connectionString

      - key: JOIN_REQUIRED
        value: "true"

      - key: MIN_SIGNAL_SCORE
        value: "75"

      - key: MIN_PROBABILITY
        value: "75"

      - key: SCAN_INTERVAL
        value: "30"

      - key: TIMEZONE
        value: "Europe/Moscow"


databases:
  - name: pocket-signal-db
    plan: free
